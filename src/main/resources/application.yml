spring:
  application:
    name: BeSpoke-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/be_spoke
    username: bespokeuser
    password: Ritikrox@18
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true    # safe if pointed at an already-created schema
    baseline-version: 0
    validate-on-migrate: false   # tolerate whitespace/checksum edits to applied migrations (seed is idempotent)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    hibernate:
      # Flyway owns the schema (V1). Hibernate reconciles as a no-op safety net.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health   # health only - keep env/beans/mappings off the wire
  endpoint:
    health:
      # /actuator/health is public (see SecurityConfig), so anonymous callers see
      # only the aggregate status. A dead DB still turns that aggregate DOWN (503).
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

app:
  jwt:
    # HS256 secret - must be at least 32 bytes. Override in production!
    secret: "n5SmGiI.-!dx/Ek5FR][ib&r5t-X&FoeX1Z*%ud%Kim"
    expiration-ms: 86400000 # 24 hours
    # Patterns (see SecurityConfig). "http://localhost:*" allows any local dev port.
  cors:
    allowed-origins: "http://localhost:*,http://127.0.0.1:*"

spring:
  application:
    name: designconnect-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/be_spoke}
    username: ${DB_USERNAME:bespokeuser}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  jpa:
    hibernate:
      # Hibernate owns the schema.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  # SMTP. Uncomment and fill in to actually send mail locally (also set app.mail.enabled).
  # mail:
  #   host: smtp.gmail.com
  #   port: 587
  #   username: no-reply@bespoke.in
  #   password: change-me
  #   properties:
  #     mail.smtp.auth: true
  #     mail.smtp.starttls.enable: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health   # health only - keep env/beans/mappings off the wire
  endpoint:
    health:
      # /actuator/health is public (see SecurityConfig), so anonymous callers see
      # only the aggregate status. A dead DB still turns that aggregate DOWN (503).
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

app:
  jwt:
    # HS256 secret - must be at least 32 bytes. Override in production!
    secret: "n5SmGiI.-!dx/Ek5FR][ib&r5t-X&FoeX1Z*%ud%Kim"
    expiration-ms: 86400000 # 24 hours
    # Patterns (see SecurityConfig). "http://localhost:*" allows any local dev port.
  cors:
    allowed-origins: "http://localhost:*,http://127.0.0.1:*"
  mail:
    # false = never send, log the whole message at INFO behind "[MAIL]" instead.
    # That console line is where you read a customer's generated password locally.
    enabled: false
    from: "BeSpoke <noreply@bespokedesign.in>"
    app-url: "http://localhost:3000"
    # Where BeSpoke's own notifications land (new partner signups). Read by humans,
    # so it is contact@ — noreply@ above is only ever the From.
    internal: "contact@bespokedesign.in"
  whatsapp:
    # WhatsApp through Gupshup: sign-in codes, the welcome after signup, and the bot
    # that answers replies. false = never send, log the message behind "[WHATSAPP]".
    # Everything below comes from the Gupshup dashboard once the number is live.
    enabled: ${WHATSAPP_ENABLED:false}
    api-key: ${GUPSHUP_API_KEY:}
    # The WhatsApp business number that sends, digits only with country code.
    source: ${GUPSHUP_SOURCE:}
    # Gupshup calls this "app name" (src.name) — the app the number is attached to.
    app-name: ${GUPSHUP_APP_NAME:}
    # Meta-approved template ids. OTP takes one parameter (the code); welcome takes
    # one (the customer's first name). Blank = that message is logged, not sent.
    otp-template-id: ${GUPSHUP_OTP_TEMPLATE:}
    welcome-template-id: ${GUPSHUP_WELCOME_TEMPLATE:}
    # Shared secret on the callback URL. Blank = the callback is closed, not open.
    webhook-token: ${GUPSHUP_WEBHOOK_TOKEN:}
    # Prepended to bare 10-digit numbers.
    country-code: "91"
  inbox:
    # Polls contact@bespokedesign.in over IMAP and turns each unread mail into a lead.
    # Off locally: set app.inbox.enabled + password (contact@'s Google App Password) to try it.
    enabled: false
    host: imap.gmail.com
    port: 993
    username: "contact@bespokedesign.in"
    password: ""
    poll-ms: 120000
  google:
    # Dev: set GOOGLE_CLIENT_ID to try Google sign-in locally. Blank = hidden.
    client-id: ${GOOGLE_CLIENT_ID:}
  crypto:
    # AES-256-GCM key for message bodies at rest (base64, exactly 32 bytes).
    # Dev default - production supplies CRYPTO_KEY (see application-prod.yml).
    key: "8Zq2mJ0xR7vT1cN5bK9wY3sD6fH4gL8pA2eU7iO0rQ4="
  storage:
    # Blank = write uploads to ./uploads on this machine, which is what you want
    # locally. Set it to a GCS bucket name and uploads go there instead; credentials
    # come from GOOGLE_APPLICATION_CREDENTIALS (a service-account JSON).
    bucket: ""
    # Only used by the local-disk path: the origin those files are reachable on.
    # Stored image URLs must be absolute — they are read back by the public website,
    # which is a different origin from this API.
    public-base-url: "http://localhost:8080"

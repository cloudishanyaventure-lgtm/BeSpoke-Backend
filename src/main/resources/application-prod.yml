spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/be_spoke}
    username: ${DB_USERNAME:bespokeuser}
    password: ${DB_PASSWORD:Ritikrox@18}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Keep the pool small so we fit in a low-memory VM alongside Postgres.
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  mail:
    # bespokedesign.in is on Google Workspace (MX → aspmx.l.google.com), so SMTP is
    # Gmail's. MAIL_PASSWORD must be a Google App Password, not the mailbox password.
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@bespokedesign.in}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # MUST be provided in production via the JWT_SECRET env var (>= 32 bytes).
    secret: ${JWT_SECRET:n5SmGiI.-!dx/Ek5FR][ib&r5t-X&FoeX1Z*%ud%Kim}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # Comma-separated list of allowed frontend origins. Browsers send Origin on every
    # POST — including same-origin ones — so the live domains must be listed here or
    # Spring answers 403 "Invalid CORS request".
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://bespokedesign.in,https://www.bespokedesign.in,https://crm.bespokedesign.in,http://localhost:*,http://127.0.0.1:*}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:BeSpoke <noreply@bespokedesign.in>}
    app-url: ${APP_URL:https://crm.bespokedesign.in}
  google:
    # OAuth 2.0 Web client id from console.cloud.google.com. Blank = the Google
    # buttons stay hidden and /api/auth/google refuses.
    client-id: ${GOOGLE_CLIENT_ID:}
  crypto:
    # MUST be provided via CRYPTO_KEY: base64 of 32 random bytes.
    # Rotating it makes every previously stored message body unreadable.
    key: ${CRYPTO_KEY:8Zq2mJ0xR7vT1cN5bK9wY3sD6fH4gL8pA2eU7iO0rQ4=}

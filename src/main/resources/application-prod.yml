spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/BeSpoke}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Keep the pool small so we fit in a low-memory VM alongside Postgres.
      maximum-pool-size: 5
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # MUST be provided in production via the JWT_SECRET env var (>= 32 bytes).
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # Comma-separated list of allowed frontend origins, e.g. https://app.example.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
